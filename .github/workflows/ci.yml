name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: node scripts/contrast.mjs
      - run: npm run build
      - name: Start server
        run: npx next start -p 3100 &
      - name: Wait for server
        run: npx --yes wait-on@9.5.1 -t 30000 http://localhost:3100
      - name: Smoke test
        run: node scripts/smoke.mjs
        env:
          BASE: http://localhost:3100
      - name: Lighthouse (accessibility and SEO are hard gates)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      - name: Lighthouse mobile (LCP is a warning)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.mobile.json
