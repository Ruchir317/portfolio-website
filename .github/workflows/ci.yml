name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node scripts/contrast.mjs
      - run: npm run build

  quality:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: npx next start -p 3100 &
      - name: Wait for server
        run: npx --yes wait-on@9.5.1 -t 30000 http://localhost:3100
      - name: Smoke test
        run: node scripts/smoke.mjs
        env:
          BASE: http://localhost:3100
      - name: Lighthouse (accessibility and SEO are hard gates)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
